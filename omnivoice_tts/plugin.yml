name: omnivoice_tts
version: 0.2.0
api_version: 2
author: HoppouAI
description: >-
  GPU TTS provider backed by k2-fsa OmniVoice. A 0.6B diffusion language
  model that supports 600+ languages with state of the art voice cloning,
  voice design (gender, age, pitch, accent), and fast inference (RTF as
  low as 0.025). Streams sentence by sentence with batch generation for
  GPU saturation, plus an anchor sentence trick to keep auto-voice mode
  consistent across a full reply. Optional remote mode lets you run the
  model on another machine and stream audio over a WebSocket.
enabled: true
requirements:
  - omnivoice>=0.1.5
  - torch>=2.5
  - torchaudio>=2.5
  - numpy>=1.24
  - scipy>=1.10
  - stream2sentence>=0.2
  - nltk>=3.8
  - websockets>=12
