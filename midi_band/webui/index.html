<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>midi_band</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>midi_band</h1>
  <span id="hostInfo" class="dim"></span>
</header>

<main>
  <section class="player" id="player">
    <div class="player-head">
      <div>
        <div id="nowSong" class="now-song">no song loaded</div>
        <div id="nowState" class="dim">idle</div>
      </div>
      <div class="player-buttons">
        <button id="btnPlay" class="primary">Play</button>
        <button id="btnPause">Pause</button>
        <button id="btnResume">Resume</button>
        <button id="btnStop">Stop</button>
        <button id="btnSoundcheck">Soundcheck</button>
        <button id="btnAutoAssign">Auto-assign</button>
      </div>
    </div>
    <div class="bar-wrap">
      <div class="bar"><div id="barFill" class="bar-fill"></div></div>
      <div class="bar-labels">
        <span id="barPos">0:00</span>
        <span id="barDur">0:00</span>
      </div>
    </div>
    <div class="vol-row">
      <label for="vol">Volume</label>
      <input id="vol" type="range" min="0" max="2" step="0.05" value="0.5">
      <span id="volVal" class="dim">0.50</span>
    </div>
    <div id="trackBox" class="track-box dim">no song loaded</div>
  </section>

  <section class="sync" id="sync">
    <div class="lib-head">
      <h2>Sync <span id="syncSummary" class="dim"></span></h2>
    </div>
    <ul id="syncList" class="sync-list"></ul>
  </section>

  <section class="upload">
    <label class="drop" id="drop">
      <input id="picker" type="file" accept=".mid,.midi" multiple hidden>
      <span>Drop .mid files here, or click to pick</span>
    </label>
    <ul id="uploadStatus" class="upload-status"></ul>
  </section>

  <section class="library">
    <div class="lib-head">
      <h2>Library <span id="count" class="dim"></span></h2>
      <button id="refresh">refresh</button>
    </div>
    <input id="search" type="search" placeholder="filter...">
    <ul id="songs" class="songs"></ul>
  </section>
</main>

<footer class="dim">Project Gabriel &middot; midi_band webui</footer>

<script src="app.js"></script>
</body>
</html>
