name: midi_band
version: 0.15.3
api_version: 1
author: HoppouAI
description: Multiple Gabriel instances on the same LAN form a band, each plays different MIDI tracks or audio stems of the same song in sync. Includes a standalone client for non-Gabriel players.
enabled: true
requirements:
  - mido>=1.3
  - pyfluidsynth>=1.3
  - google-genai>=0.3
  - sounddevice>=0.4
  - soundfile>=0.12
  - numpy>=1.23
  - imageio-ffmpeg>=0.4
