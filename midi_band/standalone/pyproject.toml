[project]
name = "midi-band-standalone"
version = "0.1.0"
description = "Standalone client for the Project Gabriel midi_band plugin. Joins a band host as a musician and plays assigned MIDI tracks via fluidsynth."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "HoppouAI" },
]
license = { text = "AGPL-3.0-or-later" }
keywords = ["midi", "fluidsynth", "vrchat", "project-gabriel", "band", "live"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mido>=1.3",
    "pyfluidsynth>=1.3",
    "pyyaml>=6",
    "colorama>=0.4",
    "pycaw>=20230407 ; sys_platform == 'win32'",
    "comtypes ; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2",
    "sounddevice>=0.4",
]

[project.scripts]
midi-band-standalone = "standalone_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This package is essentially one script that imports its sibling
# midi_band/ folder via sys.path. Building a wheel doesnt make a ton of
# sense, but hatchling needs SOMETHING to package, so we ship the script.
include = ["standalone_client.py", "cli_ui.py"]

[tool.uv]
package = false
