# OmniVoice plugin local config. Optional - everything here can also live
# in your main config.yml under plugins.omnivoice. Values in this file
# override values in config.yml.
#
# Copy this to plugins/omnivoice/config.yml and tweak. The real config.yml
# is gitignored.

# Base URL of the omnivoice-serve REST endpoint.
base_url: "http://127.0.0.1:8000"

# Pick ONE of these three modes:
#   voice_id  - clone a previously registered voice (POST /v1/voices first)
#   ref_audio - local audio file to auto-register and clone on start
#   instruct  - voice design from a text description
#   (none)    - let OmniVoice pick a voice automatically
voice_id: ""

# Path to a local reference clip (wav, mp3, flac, ogg). If set and
# voice_id is empty, the plugin POSTs this file to /v1/voices on start
# under a deterministic id derived from the file path + mtime, so reruns
# reuse the cached voice instead of re-uploading.
ref_audio: ""
# Optional transcript of ref_audio. If omitted the server auto-transcribes
# via Whisper (slower first start, more GPU memory briefly).
ref_text: ""
# Override the auto-generated voice id. Leave empty to let the plugin
# pick one from the file name + hash.
auto_voice_id: ""

instruct: ""

# Optional language hint. Empty string = auto detect. Examples: "English",
# "Japanese", "zh", "es". Specifying a language gives slightly better results.
language: ""

# Inference quality / speed knobs.
# num_steps: 4-64. Lower is faster, higher is better quality. 16-32 is a
# good range for real-time chat.
num_steps: 24

# Classifier-free guidance scale (0.0-10.0). Bump to ~3.0 if you use the
# singing model and want tag behaviour to be more pronounced.
guidance_scale: 2.0

# Speaking speed (0.25-4.0). Leave null to use the model's default.
speed: null

# Apply denoising to the output.
denoise: true

# How many sentences to synthesise in parallel. 2 keeps the GPU busy
# without blowing memory on a single GPU box.
max_concurrent: 2

# How long (seconds) to wait on a single /v1/tts/stream request before
# giving up. Long for the first sentence so cold cache requests can
# finish, shorter for streamed continuation.
request_timeout: 120
